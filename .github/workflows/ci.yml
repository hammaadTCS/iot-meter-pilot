name: CI

# Runs on every push and pull request. From here on the security-sensitive work
# (broker credentials, TLS, retention, permission guardrails) lands weekly, and
# nothing in that list should ship untested.
on:
  push:
    branches: ['**']
  pull_request:

# A newer push to the same branch cancels the older run — the old result is
# already stale and CI minutes are not free.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    # Only the 8.3 leg gates a merge. The 8.4 leg reports forward-compatibility
    # breakage without ever turning the board red — the same treatment the npm
    # audit step gets in `quality`, and for the same reason: a warning nobody
    # can act on today should not block work that is ready.
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      # Report every failing version rather than stopping at the first.
      fail-fast: false
      matrix:
        include:
          # 8.3 is the floor declared in composer.json, and what runs both
          # locally and in production. This is not a preference: every
          # spatie/laravel-permission 8.x release requires php ^8.3, and the
          # entire FGAC layer is built on that package. 8.2 was removed here
          # because it could not even install — the lock had excluded it.
          - php: '8.3'
            experimental: false
          # Forward-compat canary. config.platform.php pins resolution to 8.3,
          # so this installs the exact same locked dependency set and runs it
          # on 8.4 — which is the question worth answering before any future
          # 8.4 upgrade, rather than during one.
          - php: '8.4'
            experimental: true

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # pdo_sqlite is required, not optional: phpunit.xml runs the suite on
          # an in-memory SQLite database, and several tests carry
          # #[RequiresPhpExtension('pdo_sqlite')] and would silently SKIP
          # without it — a green run that tested nothing.
          extensions: pdo_sqlite, sqlite3, mbstring, bcmath, intl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      # --prefer-dist and the lock file keep this reproducible: CI installs the
      # exact versions committed in composer.lock, so a formatter or framework
      # release cannot change a CI result without a commit.
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Required, not optional. The suite renders Blade layouts that call
      # @vite, which reads public/build/manifest.json at render time.
      # public/build is gitignored (.gitignore:16), so without a build here 17
      # tests die on ViteManifestNotFoundException before asserting anything.
      # This passes on a developer machine only because the working tree
      # already has a built public/build lying around.
      #
      # $this->withoutVite() in tests/TestCase.php would be cheaper, but it
      # would hollow out `csp allows the assets the dashboards actually load`
      # in SecurityHeadersTest — a test that exists because a CSP change broke
      # the dashboard for real. Building is the honest option, and it catches
      # asset breakage in the same job that would surface it.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install npm packages
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Run tests
        run: php artisan test

  quality:
    name: Code style + dependency audits
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring, bcmath, intl
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # Blocking. The whole codebase was formatted in c47e14c and is clean, so
      # any failure here is genuinely new drift. Note the version is pinned by
      # composer.lock — a pint MINOR release can add fixers (1.27 -> 1.30 added
      # fully_qualified_strict_types and touched 14 files), so if this fails
      # right after a `composer update`, run `./vendor/bin/pint` and commit that
      # as its own change.
      - name: Check code style
        run: ./vendor/bin/pint --test

      # Blocking. Clean as of c38a4b9. If this fails, first try
      # `composer update` — every advisory to date was fixable inside the
      # existing constraints without a major bump.
      - name: Audit PHP dependencies
        run: composer audit --no-interaction

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install npm packages
        run: npm ci

      # Catches asset build breakage, which no PHP test can see.
      - name: Build assets
        run: npm run build

      # NON-BLOCKING, deliberately — revisit and make this blocking once the
      # finding below is resolved.
      #
      # Known: laravel-echo -> socket.io-client -> engine.io-client -> ws pulls
      # in `ws` advisories. This project drives Reverb over the PUSHER protocol
      # (pusher-js), not socket.io, so that path is never imported; and `ws` is
      # a Node WebSocket library that browsers never receive, since
      # engine.io-client uses the native WebSocket in a bundle. So it does not
      # reach production.
      #
      # Note `npm audit --omit=dev` reports zero here, but that is misleading
      # rather than reassuring: package.json declares NO `dependencies` block at
      # all, so genuinely shipped libraries (alpinejs, axios, laravel-echo,
      # pusher-js) sit in devDependencies and --omit=dev would hide real issues
      # in them. The full audit is the honest one to run.
      - name: Audit npm dependencies (reported, not enforced)
        run: npm audit --audit-level=high
        continue-on-error: true
